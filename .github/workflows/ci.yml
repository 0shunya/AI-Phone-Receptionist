name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "30 2 * * *"   # milestone M6: scripted calls run nightly with pass or fail

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reception
          POSTGRES_PASSWORD: reception
          POSTGRES_DB: reception_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reception" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql+psycopg://reception:reception@localhost:5432/reception_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Migrations apply to an empty database and match the models
        run: DATABASE_URL=$TEST_DATABASE_URL python -m alembic upgrade head && DATABASE_URL=$TEST_DATABASE_URL python -m alembic check
      - name: Tests (PostgreSQL, scripted or rule-based brain; no API key)
        run: python -m pytest
      - name: Scenario evaluation, offline (rules brain + scripted caller)
        working-directory: .
        run: EVAL_DATABASE_URL=$TEST_DATABASE_URL python evaluation/run_eval.py --brain rules --burst 10 --load 30 --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
