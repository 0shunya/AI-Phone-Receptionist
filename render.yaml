# Render Blueprint for the API. The database is external (Neon recommended; see DEPLOYMENT.md).
services:
  - type: web
    name: ai-phone-receptionist-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_BRAIN
        value: gemini
      # Its own model: the free key's ~20 requests/day are per model, and the Expense Scanner uses 3.5-flash-lite.
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: GEMINI_THINKING_LEVEL
        value: minimal
      - key: DAILY_MODEL_CALL_LIMIT
        value: "15"  # model calls (not phone calls) per rolling 24 h; see DEPLOYMENT.md
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEMO_ACCESS_CODE
        sync: false
      - key: CALLS_PER_HOUR_PER_CLIENT
        value: "10"
      - key: TURNS_PER_MINUTE_PER_CALL
        value: "12"
